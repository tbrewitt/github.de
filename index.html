<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#010207">
<meta name="description" content="Erde und Weltraum. Eine vollständig mit Code erzeugte Szene.">
<title>titanitus — Orbit</title>
<style>

.ring{position:absolute;left:-6px;top:-6px;width:12px;height:12px;border:1px solid #ff554d;border-radius:50%;background:#ff453f12;animation:ping 3s cubic-bezier(.15,.35,.35,1) infinite;will-change:transform,opacity}
.ring.second{animation-delay:-1.5s}

<canvas id="space" role="img" aria-label="Blick aus dem Weltraum auf die gekrümmte Erde mit Ozeanen, Kontinenten, Wolken und einer dünnen blauen Atmosphäre vor einem natürlichen Sternenhimmel."></canvas>

<script id="vertex" type="x-shader/x-vertex">
attribute vec2 position;
void main(){gl_Position=vec4(position,0.,1.);}
</script>
