<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#010207">
<meta name="description" content="Erde und Weltraum. Eine vollständig mit Code erzeugte Szene.">
<title>titanitus — Orbit</title>
<style>
*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#010207}canvas{display:block;width:100%;height:100%;position:fixed;inset:0}#fallback{display:none;color:#a4afbf;font:14px/1.6 system-ui;position:fixed;inset:0;place-content:center;padding:32px}html.unavailable #fallback{display:grid}
</style>

<body>
<canvas id="space" role="img" aria-label="Blick aus dem Weltraum auf die gekrümmte Erde mit Ozeanen, Kontinenten, Wolken und einer dünnen blauen Atmosphäre vor einem natürlichen Sternenhimmel."></canvas>
<div id="fallback">Diese Weltraumszene benötigt WebGL. Bitte aktiviere die Hardwarebeschleunigung deines Browsers.</div>
<script id="vertex" type="x-shader/x-vertex">
attribute vec2 position;
void main(){gl_Position=vec4(position,0.,1.);}
</script>
<script id="fragment" type="x-shader/x-fragment">
precision highp float;
uniform vec2 resolution;
uniform sampler2D geography;
const float PI=3.14159265359;
float hash(vec2 p){vec3 q=fract(vec3(p.xyx)*.1031);q+=dot(q,q.yzx+33.33);return fract((q.x+q.y)*q.z);}
float noise(vec3 p){vec3 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);vec2 b=i.xy+vec2(37.,113.)*i.z;return mix(mix(mix(hash(b),hash(b+vec2(1,0)),f.x),mix(hash(b+vec2(0,1)),hash(b+vec2(1)),f.x),f.y),mix(mix(hash(b+vec2(37,113)),hash(b+vec2(38,113)),f.x),mix(hash(b+vec2(37,114)),hash(b+vec2(38,114)),f.x),f.y),f.z);}
float fbm(vec3 p){float a=.5,v=0.;for(int i=0;i<6;i++){v+=a*noise(p);p=p*2.03+vec3(17.1,9.2,13.7);a*=.5;}return v;}
vec3 stars(vec2 uv,float scale,float seed){vec2 grid=uv*scale,cell=floor(grid);vec2 location=vec2(hash(cell+seed),hash(cell+seed+71.));vec2 d=(fract(grid)-location);float h=hash(cell+seed+19.);float bright=pow(h,12.);float point=exp(-dot(d,d)*14000./(resolution.y/1100.));vec3 tint=mix(vec3(.65,.78,1.),vec3(1.,.86,.69),hash(cell+seed+53.));return tint*point*bright*1.7;}
vec2 intersectSphere(vec3 ro,vec3 rd,vec3 c,float r){vec3 oc=ro-c;float b=dot(oc,rd),h=b*b-dot(oc,oc)+r*r;if(h<0.)return vec2(-1.);h=sqrt(h);return vec2(-b-h,-b+h);}
float landAt(vec3 n){float lon=atan(n.x,n.z)+.17;vec2 uv=vec2(fract(lon/(2.*PI)+.5),asin(clamp(n.y,-1.,1.))/PI+.5);vec2 warp=vec2(fbm(n*57.),fbm(n*63.+30.))-.5;return texture2D(geography,uv+warp*.004).r;}
float clouds(vec3 n){vec3 p=n*5.;float curl=fbm(p*1.9);p+=vec3(curl,-curl,curl*.5)*1.25;float bands=fbm(p*3.2+vec3(5,0,3));float detail=fbm(n*125.);return smoothstep(.47,.69,bands*.82+detail*.18);}
void main(){
 vec2 uv=gl_FragCoord.xy/resolution;vec2 p=(gl_FragCoord.xy-.5*resolution)/resolution.y;
 vec3 rd=normalize(vec3(p,-1.35));vec3 ro=vec3(0.);vec3 center=vec3(0.,-3.,-6.3);float radius=3.3;
 vec3 sun=normalize(vec3(-.72,.62,.72));
 vec3 col=vec3(.00035,.0006,.0015);
 col+=stars(p,57.,3.)+stars(p,103.,47.)*.58+stars(p,171.,129.)*.29;
 // The atmosphere is a thin physical shell: density decays with altitude.
 vec2 air=intersectSphere(ro,rd,center,radius+.055);
 vec2 ground=intersectSphere(ro,rd,center,radius);
 if(ground.x>0.){
  vec3 hit=rd*ground.x,n=normalize(hit-center);float mu=dot(n,sun);float daylight=smoothstep(-.10,.22,mu);
  float land=landAt(n);float continent=smoothstep(.29,.71,land);
  float latitude=asin(n.y);float terrain=fbm(n*39.);float fine=fbm(n*290.);
  vec3 ocean=mix(vec3(.003,.012,.035),vec3(.005,.035,.073),max(mu,0.));
  float coast=4.*land*(1.-land);ocean+=vec3(.006,.035,.034)*coast;
  float longitude=atan(n.x,n.z)+.17;float sahara=smoothstep(-.40,-.18,longitude)*(1.-smoothstep(.70,1.05,longitude));float desert=exp(-pow((latitude-.40)/.22,2.))*mix(.4,1.,sahara);
  vec3 soil=mix(vec3(.048,.084,.047),vec3(.21,.165,.095),desert);
  soil*=.70+terrain*.65;soil+=vec3(.028,.022,.012)*(fine-.5);
  float mountain=pow(max(0.,1.-abs(terrain-.51)*5.),5.);
  soil=mix(soil,vec3(.21,.205,.183),mountain*.22);
  float snow=smoothstep(.98,1.30,latitude+(terrain-.5)*.35);
  soil=mix(soil,vec3(.66,.73,.77),snow);
  vec3 surface=mix(ocean,soil,continent);
  // Restrained sunlight, a little reflected blue skylight, and ocean glint.
  surface*=max(mu,0.)*1.45+.012;
  vec3 halfVector=normalize(sun-rd);float spec=pow(max(dot(n,halfVector),0.),110.);
  surface+=vec3(.60,.68,.72)*spec*.30*(1.-continent)*daylight;
  vec3 cloudN=normalize(rd*intersectSphere(ro,rd,center,radius+.022).x-center);
  float cloud=clouds(cloudN);float shadow=clouds(normalize(n+sun*.009));
  surface*=1.-shadow*.24*daylight;
  float cloudLight=max(mu,0.)*1.2+.025;
  surface=mix(surface,vec3(.75,.80,.86)*cloudLight,cloud*.94);
  float limb=pow(1.-max(dot(n,-rd),0.),3.4);
  surface=mix(surface,vec3(.065,.24,.48)*(.2+max(mu,0.)*.8),limb*.40*daylight);
  col=surface;
 }
 if(air.x>0.){
  float end=ground.x>0.?ground.x:air.y;float stepSize=(end-air.x)/12.;vec3 optical=vec3(0.);float depth=0.;
  for(int i=0;i<12;i++){
   vec3 q=rd*(air.x+(float(i)+.5)*stepSize)-center;float height=length(q)-radius;
   float density=exp(-max(height,0.)/.011);float lit=smoothstep(-.12,.20,dot(normalize(q),sun));
   optical+=vec3(.14,.43,1.)*density*stepSize*lit;depth+=density*stepSize;
  }
  float phase=.72+.28*pow(dot(rd,sun),2.);
  col=col*exp(-depth*vec3(1.1,1.9,3.0))+optical*phase*2.65;
 }
 // Filmic exposure with a restrained display transfer, no bloom or lens flares.
 col=vec3(1.)-exp(-col*1.6);col=pow(max(col,vec3(0.)),vec3(1./2.2));
 float grain=(hash(gl_FragCoord.xy)-.5)/550.;col+=grain;
 gl_FragColor=vec4(col,1.);
}
</script>
<script>

 ];
